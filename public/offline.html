<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>You're offline · AuxRoom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        /* Deliberately self-contained (no external CSS/JS) so the service
           worker only needs to cache this one file to serve it offline. */
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            background: #0a0d12;
            color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .icon {
            width: 56px;
            height: 56px;
            color: #22c55e;
        }
        h1 {
            margin: 24px 0 8px;
            font-size: 22px;
            font-weight: 700;
        }
        p {
            margin: 0;
            max-width: 320px;
            color: #9aa4b2;
            font-size: 14px;
            line-height: 1.5;
        }
        button {
            margin-top: 24px;
            padding: 10px 24px;
            border: none;
            border-radius: 9999px;
            background: #22c55e;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" />
        <path d="M2 8.82a15 15 0 0 1 20 0" />
        <path d="M5 12.859a10 10 0 0 1 14 0" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <line x1="3" y1="3" x2="21" y2="21" />
    </svg>
    <h1>You're offline</h1>
    <p>AuxRoom needs an internet connection to sync your room. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
</body>
</html>
